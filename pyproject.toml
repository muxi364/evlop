[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evlop"
version = "0.1.0"
description = "EVLOP: Universal Self-Evolving Agent Framework & Darwinian Memory Engine distilled from Claude 5.2/5.5 and SOTA Agent Research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "muxi364"}
]
keywords = ["ai-agents", "self-evolving-agents", "claude-code", "agent-memory", "evlop", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
evlop = "evlop.cli:entry_point"

[tool.setuptools.packages.find]
where = ["src"]
